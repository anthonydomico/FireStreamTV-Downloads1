name: Publish DREAM STREAMZ scrollable-channel guide APK
on:
  push:
    paths:
      - '.github/workflows/publish-all-channel-guide.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve verified APK build
        env:
          TRANSFER_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-ab7c-81f5-b4cc-31a2d7cf83ef/raw?se=2026-11-21T16%3A48%3A07Z&sp=r&sv=2026-06-06&sr=b&scid=44794232-74f0-5d3d-9997-187b3f9c8fe1&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-21T14%3A23%3A40Z&ske=2026-11-22T14%3A23%3A40Z&sks=b&skv=2026-06-06&sig=YskALk3Hg%2BDGtCLhXTIMi7paaIB92BWC/BUUHo/O9LY%3D'
        run: |
          curl -fL --retry 3 --silent --show-error "$TRANSFER_URL" -o /tmp/dream-streamz.zip
          unzip -o -j /tmp/dream-streamz.zip app-debug.apk -d /tmp
          test -s /tmp/app-debug.apk
          cp /tmp/app-debug.apk app-debug.apk
      - name: Publish public APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-debug.apk
          git diff --cached --quiet || (git commit -m "Publish DREAM STREAMZ scrollable Live TV guide" && git push origin HEAD:main)
