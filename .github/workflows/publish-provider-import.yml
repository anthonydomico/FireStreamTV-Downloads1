name: Publish DREAM STREAMZ provider-import APK
on:
  push:
    paths:
      - '.github/workflows/publish-provider-import.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified provider-import APK artifact
        env:
          TRANSFER_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-886c-81f5-a65b-a94d7620db50/raw?se=2026-11-21T16%3A40%3A30Z&sp=r&sv=2026-06-06&sr=b&scid=719f9ee4-36c1-50f7-8234-031ed7aad1f6&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-21T05%3A04%3A55Z&ske=2026-11-22T05%3A04%3A55Z&sks=b&skv=2026-06-06&sig=RVZlljtHvY5KjKI77tmH87YLQnegQIBzwySYQJ7Utbo%3D'
        run: |
          curl -fL --retry 3 --silent --show-error "$TRANSFER_URL" -o /tmp/dream-streamz.zip
          unzip -o -j /tmp/dream-streamz.zip app-debug.apk -d /tmp
          test -s /tmp/app-debug.apk
          cp /tmp/app-debug.apk app-debug.apk
      - name: Publish updated public APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-debug.apk
          git diff --cached --quiet || (git commit -m "Publish DREAM STREAMZ with provider import" && git push origin HEAD:main)
