name: Publish DREAM STREAMZ 1.5 VOD and Series
on:
  push:
    paths:
      - '.github/workflows/publish-library-1-5.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download successful VOD Series build
        env:
          TRANSFER_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-bca4-81f5-8be3-3753ba7678e9/raw?se=2026-11-21T17%3A14%3A31Z&sp=r&sv=2026-06-06&sr=b&scid=5b55422e-88c6-5cda-b22b-d58342f5818a&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-21T14%3A23%3A36Z&ske=2026-11-22T14%3A23%3A36Z&sks=b&skv=2026-06-06&sig=AW%2BqTBXzHdOhF6kRYsIMaIMdP%2BgsSrh25kMMT8cQFV8%3D'
        run: |
          curl -fL --retry 3 --silent --show-error "$TRANSFER_URL" -o /tmp/dream-streamz.zip
          unzip -o -j /tmp/dream-streamz.zip app-debug.apk -d /tmp
          test -s /tmp/app-debug.apk
          cp /tmp/app-debug.apk app-debug.apk
      - name: Publish updated APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-debug.apk
          git diff --cached --quiet || (git commit -m "Publish DREAM STREAMZ 1.5 VOD and Series APK" && git push origin HEAD:main)
